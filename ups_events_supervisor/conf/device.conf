# ------------------------------------------------------------
# device.conf
# Managed network devices
#
# Format:
# name|host|mac|role|auto_start|ports
#
# role:
#   critical  - must be shut down on power loss
#   user      - optional (e.g. desktop PC)
#
# auto_start:
#   yes       - can be woken automatically
#   no        - manual start only
#
# ports:
#   Comma-separated TCP ports to detect if the device is active.
#   Use "-" or empty to treat ping as the only activity signal.
# ------------------------------------------------------------

DEVICES=(
  # Replace ports with the services you expect to be "active" on each host
  "nas|192.168.1.10|AA:BB:CC:DD:EE:01|critical|yes|-"
  "proxmox|192.168.1.20|AA:BB:CC:DD:EE:02|critical|yes|-"
  "pc|192.168.1.30|AA:BB:CC:DD:EE:03|user|no|-"
)
