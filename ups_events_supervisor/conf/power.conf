# ------------------------------------------------------------
# power.conf
# Global power and UPS-related settings
# ------------------------------------------------------------

# UPS identification (used by ups-lib if needed)
UPS_NAME="ups"
UPS_HOST="127.0.0.1"

# Battery thresholds (percent)
MIN_START_BATTERY=30     # Minimum battery level to allow auto-start
CRITICAL_BATTERY=20      # Emergency shutdown threshold

# Timeouts (seconds)
BATTERY_GRACE_PERIOD=180     # Wait before shutdown when power lost
FORCE_SHUTDOWN_TIMEOUT=180  # Max time to wait for graceful shutdown
POWER_STABLE_TIME=120        # Power must be stable before wake-up

# Supervisor loop interval
CHECK_INTERVAL=10
