# ------------------------------------------------------------
# power.conf
# Global power and UPS-related settings
# ------------------------------------------------------------

# UPS identification (used by ups-lib if needed)
UPS_NAME="ups"
UPS_HOST="127.0.0.1"

# Battery thresholds (percent)
MIN_START_BATTERY=30     # Minimum battery level to allow auto-start
CRITICAL_BATTERY=20      # Emergency shutdown threshold

# Timeouts (seconds)
BATTERY_GRACE_PERIOD=180     # Wait before shutdown when power lost
FORCE_SHUTDOWN_TIMEOUT=180  # Max time to wait for graceful shutdown

# Flapping protection (seconds)
# Require power state to be stable before acting on it
ONLINE_STABLE_MIN=30
ONBATT_STABLE_MIN=10

# Auto-wake limits
# Maximum number of auto-wake attempts during one ONLINE session
AUTO_WAKE_MAX_ATTEMPTS=3

# Shutdown request cooldown (seconds)
# Prevents repeated shutdown triggers in rapid succession
SHUTDOWN_COOLDOWN=30

# Auto-wake cooldown (seconds)
# Minimum time between WOL attempts per device
AUTO_WAKE_COOLDOWN=30

# Stale ONLINE marker TTL (seconds)
# 0 disables auto-clear, otherwise clears power_restored_at after TTL
POWER_RESTORED_TTL=0

# Periodic status log (seconds)
# 0 disables periodic summary logs
STATUS_LOG_INTERVAL=0

# Power stability before auto-wake (seconds)
# Low charge requires longer stability window to avoid flapping
POWER_STABLE_TIME_LOW=120    # Used when battery charge is low
POWER_STABLE_TIME_HIGH=60    # Used when battery charge is sufficient

# Supervisor loop interval
CHECK_INTERVAL=10
