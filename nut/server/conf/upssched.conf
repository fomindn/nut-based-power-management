CMDSCRIPT /usr/local/powerctl/bin/ups-event-writer.sh
PIPEFN /run/powerctl/upssched.pipe
LOCKFN /run/powerctl/upssched.lock

# UPS power events mapped to the supervisor state writer
AT ONBATT  * EXECUTE onbatt
AT ONLINE  * EXECUTE online
AT LOWBATT * EXECUTE lowbatt
AT COMMBAD * EXECUTE commbad
AT COMMFAULT * EXECUTE commfault
AT COMMOK * EXECUTE commok